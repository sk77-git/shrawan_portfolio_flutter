name: Build and Deploy Web App to cPanel

on:
  pull_request:
    types: [ closed ]
    branches: [ "main" ]

jobs:
  web-deploy:
    name: Build & Deploy
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Deploy to cPanel via SSH/SFTP
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SFTP_SERVER }}
          REMOTE_USER: ${{ secrets.SFTP_USERNAME }}
          REMOTE_PORT: ${{ secrets.SFTP_PORT }}
          SOURCE: "build/web/"
          TARGET: ${{ secrets.FTP_SERVER_DIR }}
          ARGS: "-rlgoDzvc -i --delete"

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Deployment ${{ job.status }}: ${{ github.repository }} (PR #${{ github.event.pull_request.number }})"
          to: shrawankumarthakur77@gmail.com
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Deployment Status: ${{ job.status }}

            Repository: ${{ github.repository }}
            Pull Request: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            Merged By: ${{ github.actor }}
            Commit Hash: ${{ github.sha }}

            View Full Run Details & Failure Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}